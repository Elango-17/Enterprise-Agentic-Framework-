[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-agent-framework"
version = "0.1.0"
description = "CLI-first enterprise agent, workflow, tool, guardrail, LLM, and RAG framework."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.16,<1.0",
    "rich>=13.9,<15.0",
    "pydantic>=2.10,<3.0",
    "PyYAML>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
    "crewai>=0.100,<2.0",
]
[project.optional-dependencies]
openai = ["openai>=1.99,<2.0"]
llm = [
    "openai>=1.99,<2.0",
    "anthropic>=0.30.0",
    "google-genai>=1.0.0",
    "ollama>=0.1.0",
]
rag = [
    "chromadb>=0.5.0,<2.0",
    "pypdf>=5.0,<7.0",
    "python-docx>=1.1,<2.0",
    "pymupdf>=1.24,<2.0",
    "pytesseract>=0.3.13,<1.0",
    "Pillow>=10.0,<13.0",
]
dev = ["pytest>=8.0,<9.0", "ruff>=0.12,<1.0"]

[project.scripts]
eaf = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["agents*", "tools*", "workflows*", "guardrails*", "kb*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
